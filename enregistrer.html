<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Enregistrer les sons — ABC de Léo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Enregistrer les sons des lettres (réservé aux parents)">
<meta name="robots" content="noindex">

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#fff8ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1b16" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">

<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./enregistrer.css">
</head>
<body class="page-enregistrer">

<div class="barre-haut">
  <a href="./index.html" class="btn-nav btn-maison" aria-label="Retour au menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  <h1 class="titre-enregistrer">Enregistrer les sons</h1>
</div>

<p class="instructions-enregistrer">
  Touchez une lettre, puis 🎙️ pour enregistrer son son (« sss », « mmm », « beu »…).
  Parlez près du micro.
</p>

<div class="grille-lettres" id="grille-lettres" aria-label="Choisir une lettre"></div>

<div class="panneau-lettre ecran-actif-masque" id="panneau-lettre">
  <div class="lettre-panneau-geante" id="lettre-panneau-geante"></div>

  <div class="indicateur-enregistrement ecran-actif-masque" id="indicateur-enregistrement" aria-hidden="true">
    <span class="point-rouge"></span> Enregistrement…
  </div>

  <p class="message-enregistrer" id="message-enregistrer" aria-live="polite"></p>

  <div class="boutons-panneau">
    <button type="button" class="btn-micro" id="btn-micro">
      <span id="btn-micro-icone">🎙️</span>
      <span id="btn-micro-texte">Enregistrer</span>
    </button>
    <div class="boutons-secondaires">
      <button type="button" class="btn-secondaire" id="btn-ecouter">▶️ Écouter</button>
      <button type="button" class="btn-secondaire" id="btn-effacer-lettre">🗑️ Effacer</button>
      <button type="button" class="btn-secondaire" id="btn-lettre-suivante">➡️ Lettre suivante</button>
    </div>
  </div>
</div>

<button type="button" class="btn-tout-effacer" id="btn-tout-effacer">Tout effacer</button>

<script src="./enregistrements.js"></script>
<script src="./enregistrer.js"></script>
</body>
</html>
